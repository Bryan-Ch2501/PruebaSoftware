<style>
:root {
    --primary-blue: #1a73e8;
    --text-main: #3c4043;
    --white: #ffffff;
    --bg-gray: #f1f3f4;
}

/* Reset básico */
* { box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* Evita scrolls dobles */
}

/* Encabezado Azul */
header {
    background-color: var(--primary-blue);
    color: var(--white);
    height: 80px;
    padding: 0 2%;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    z-index: 10;
}

/* Contenedor y estilo de la imagen */
.logo-container {
    height: 70px; /* Define el alto de tu logo */
    margin-right: 25px;
    display: flex;
    align-items: center;
    border-radius: 8px;
    background: #ffffff;
    justify-content: center; 
}

.logo-adaptable {
    max-height: 90%;   
    max-width: 90%;
    height: auto;
    width: auto;
    object-fit: contain; /* Mantiene la proporción sin deformar */
}

.ExerciseTitle {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
}

/* Layout principal */
.wrapper {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* Barra lateral */
nav {
    width: 300px;
    background: var(--bg-gray);
    padding: 20px;
    overflow-y: auto;
    border-right: 1px solid #ddd;
}

.Index { 
    list-style: none; 
    padding: 0; 
}

.Index li { margin-bottom: 12px; }

.Index a {
    display: block;
    padding: 15px;
    background: var(--white);
    text-decoration: none;
    color: var(--text-main);
    border-radius: 8px;
    border: 1px solid #e0e0e0;
    transition: all 0.3s ease;
    font-weight: 500;
}

.Index a:hover { 
    background: var(--primary-blue); 
    color: white; 
    transform: translateX(5px);
}

/* Visor de contenido */
#visor {
    flex: 1;
    border: none;
    background: var(--white);
    width: 100%;
    height: 100%;
}

/* Responsivo para móviles */
@media (max-width: 768px) {
    .wrapper { flex-direction: column; }
    nav { width: 100%; height: auto; }
}

.footer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    padding: 20px;
    border-top: 1px solid #ccc;
  }
  .footer a {
    display: flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    color: #000;
  }
</style>
</head>
